<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root {
    --bg: #040d18;
    --bg2: #060f1e;
    --panel: rgba(6,16,32,0.92);
    --panel-border: rgba(0,200,255,0.18);
    --panel-glow: rgba(0,200,255,0.06);
    --line: rgba(0,200,255,0.15);
    --text: #c8e8ff;
    --text-dim: #5a8aaa;
    --brand: #00c8ff;
    --brand-dark: #0088cc;
    --brand-2: #00ffaa;
    --brand-3: #ff6b35;
    --danger: #ff3366;
    --danger-bg: rgba(255,51,102,0.08);
    --danger-border: rgba(255,51,102,0.3);
    --code-bg: #020810;
    --code-text: #7efff5;
    --neon-glow: 0 0 8px rgba(0,200,255,0.6), 0 0 20px rgba(0,200,255,0.2);
    --neon-glow-green: 0 0 8px rgba(0,255,170,0.6), 0 0 20px rgba(0,255,170,0.2);
    --neon-glow-red: 0 0 8px rgba(255,51,102,0.6);
}

* { box-sizing: border-box; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.3); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--brand); }

/* animations removed */

body {
    margin: 0;
    font-family: "Rajdhani", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
}

/* Background grid effect */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
}

/* Ambient glow blobs */
body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 15% 50%, rgba(0,200,255,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 20%, rgba(0,255,170,0.04) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 100%, rgba(0,100,200,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
}

.app {
    display: grid;
    grid-template-columns: 270px 1fr;
    gap: 12px;
    height: 100vh;
    padding: 12px;
    overflow: hidden;
    position: relative;
    z-index: 1;
}

/* Panel base */
.panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    position: relative;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    overflow: hidden;
}

/* Panel inner glow */
.panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--panel-glow);
    pointer-events: none;
}

/* Corner decorations */
.panel::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--brand), transparent);
    opacity: 0.6;
}

/* Corner brackets */
.panel .corner-tl,
.panel .corner-tr,
.panel .corner-bl,
.panel .corner-br {
    position: absolute;
    width: 12px; height: 12px;
    z-index: 2;
    opacity: 0.7;
}
.panel .corner-tl { top: 0; left: 0; border-top: 2px solid var(--brand); border-left: 2px solid var(--brand); }
.panel .corner-tr { top: 0; right: 0; border-top: 2px solid var(--brand); border-right: 2px solid var(--brand); }
.panel .corner-bl { bottom: 0; left: 0; border-bottom: 2px solid var(--brand); border-left: 2px solid var(--brand); }
.panel .corner-br { bottom: 0; right: 0; border-bottom: 2px solid var(--brand); border-right: 2px solid var(--brand); }

/* ---- SIDEBAR ---- */
.sidebar {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}

.sidebar-head {
    padding: 16px 14px 12px;
    border-bottom: 1px solid var(--line);
    position: relative;
}

.sidebar-head::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--brand), transparent);
    opacity: 0.5;
}

.sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.logo-icon {
    width: 32px; height: 32px;
    border: 1.5px solid var(--brand);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-family: "Orbitron", monospace;
    font-weight: 900;
    color: var(--brand);
    text-shadow: var(--neon-glow);
    box-shadow: 0 0 10px rgba(0,200,255,0.2), inset 0 0 8px rgba(0,200,255,0.1);
    position: relative;
}

.logo-icon::before {
    content: '';
    position: absolute;
    inset: 2px;
    border: 1px solid rgba(0,200,255,0.2);
    border-radius: 2px;
}

.sidebar-head h1 {
    margin: 0;
    font-size: 13px;
    font-family: "Orbitron", monospace;
    font-weight: 700;
    color: var(--brand);
    text-shadow: var(--neon-glow);
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

.sidebar-head .sub-title {
    font-size: 10px;
    color: var(--text-dim);
    font-family: "Share Tech Mono", monospace;
    letter-spacing: 0.1em;
    margin-top: 1px;
}

.session-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.session-list-header {
    font-size: 10px;
    font-family: "Share Tech Mono", monospace;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 4px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.session-list-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
}

.session-item {
    border: 1px solid rgba(0,200,255,0.1);
    border-radius: 3px;
    padding: 10px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    background: rgba(0,200,255,0.03);
    transition: all .2s ease;
    position: relative;
    overflow: hidden;
}

.session-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--brand);
    opacity: 0;
    transition: opacity .2s;
    box-shadow: var(--neon-glow);
}

.session-item:hover {
    background: rgba(0,200,255,0.07);
    border-color: rgba(0,200,255,0.3);
}

.session-item:hover::before { opacity: 1; }

.session-item.active {
    border-color: rgba(0,200,255,0.4);
    background: rgba(0,200,255,0.08);
}

.session-item.active::before { opacity: 1; }

.session-item .name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    font-family: "Rajdhani", sans-serif;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.session-item.active .name { color: var(--brand); }

.session-item .meta {
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: "Share Tech Mono", monospace;
}

/* ---- MAIN ---- */
.main {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    background: rgba(0,0,0,0.2);
    position: relative;
}

.toolbar::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 5%; right: 5%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,200,255,0.3), transparent);
}

.toolbar label {
    font-size: 11px;
    color: var(--text-dim);
    font-family: "Share Tech Mono", monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

/* ---- BUTTONS ---- */
.btn {
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    font-family: "Rajdhani", sans-serif;
    transition: all .2s ease;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
}

.btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .2s;
}

.btn:hover::before { opacity: 1; }
.btn:disabled { opacity: .3; cursor: not-allowed; }

.btn.primary {
    color: var(--bg);
    background: var(--brand);
    border-color: var(--brand);
    font-weight: 700;
    box-shadow: 0 0 12px rgba(0,200,255,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
    text-shadow: none;
}

.btn.primary::before {
    background: rgba(255,255,255,0.15);
}

.btn.primary:hover {
    box-shadow: var(--neon-glow), inset 0 1px 0 rgba(255,255,255,0.2);
    transform: translateY(-1px);
}

.btn.outline {
    color: var(--brand);
    background: rgba(0,200,255,0.05);
    border-color: rgba(0,200,255,0.3);
}

.btn.outline::before { background: rgba(0,200,255,0.08); }
.btn.outline:hover { border-color: var(--brand); box-shadow: 0 0 8px rgba(0,200,255,0.2); }

.btn.danger {
    color: var(--danger);
    background: var(--danger-bg);
    border-color: var(--danger-border);
}

.btn.danger:hover { box-shadow: var(--neon-glow-red); }

.btn.small { padding: 5px 9px; font-size: 11px; border-radius: 2px; }

/* ---- FORM CONTROLS ---- */
select, input[type="number"], textarea, input[type="text"] {
    border: 1px solid rgba(0,200,255,0.2);
    border-radius: 3px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: "Share Tech Mono", monospace;
    background: rgba(0,10,25,0.8);
    color: var(--brand);
    transition: all .2s ease;
    outline: none;
}

select:focus, input[type="number"]:focus, textarea:focus, input[type="text"]:focus {
    border-color: var(--brand);
    box-shadow: 0 0 8px rgba(0,200,255,0.2), inset 0 0 4px rgba(0,200,255,0.05);
}

select option { background: #040d18; color: var(--text); }

/* ---- CHECKBOX ---- */
input[type="checkbox"] {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border: 1px solid rgba(0,200,255,0.4);
    border-radius: 2px;
    background: rgba(0,10,25,0.8);
    cursor: pointer;
    position: relative;
    vertical-align: middle;
    transition: all .2s;
}

input[type="checkbox"]:checked {
    background: var(--brand);
    border-color: var(--brand);
    box-shadow: 0 0 6px rgba(0,200,255,0.5);
}

input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--bg);
    font-size: 10px;
    line-height: 1;
}

/* ---- CHAT AREA ---- */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: rgba(0,0,0,0.1);
}

/* Empty state */
.chat:empty::after {
    content: '// AWAITING INPUT...';
    display: block;
    text-align: center;
    color: rgba(0,200,255,0.15);
    font-family: "Share Tech Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.2em;
    margin-top: 40%;
}

.msg {
    display: flex;
    margin: 10px 0;
    width: 100%;
    align-items: flex-start;
    gap: 10px;
}

.msg.user { justify-content: flex-end; }
.msg.ai { justify-content: flex-start; }

.avatar {
    width: 30px; height: 30px;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    font-family: "Orbitron", monospace;
    flex: 0 0 30px;
    position: relative;
}

.msg.user .avatar {
    background: rgba(0,200,255,0.1);
    border: 1px solid rgba(0,200,255,0.4);
    color: var(--brand);
    box-shadow: 0 0 8px rgba(0,200,255,0.15);
}

.msg.ai .avatar {
    background: rgba(0,255,170,0.08);
    border: 1px solid rgba(0,255,170,0.35);
    color: var(--brand-2);
    box-shadow: 0 0 8px rgba(0,255,170,0.15);
}

.bubble-wrap {
    display: flex;
    flex-direction: column;
    max-width: min(78%, 760px);
}

.msg.user .bubble-wrap { align-items: flex-end; }
.msg.ai .bubble-wrap { align-items: flex-start; }

.role-tag {
    font-size: 10px;
    color: var(--text-dim);
    margin: 0 3px 4px 3px;
    font-family: "Share Tech Mono", monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.msg.ai .role-tag { color: rgba(0,255,170,0.5); }
.msg.user .role-tag { color: rgba(0,200,255,0.5); }

.bubble {
    padding: 10px 14px;
    border-radius: 3px;
    line-height: 1.65;
    word-break: break-word;
    position: relative;
    font-size: 14px;
}

.msg.user .bubble {
    background: rgba(0,200,255,0.08);
    border: 1px solid rgba(0,200,255,0.25);
    color: var(--text);
    white-space: pre-wrap;
    border-top-right-radius: 1px;
}

.msg.user .bubble::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,200,255,0.4));
}

.msg.ai .bubble {
    background: rgba(0,20,40,0.7);
    border: 1px solid rgba(0,200,255,0.12);
    border-top-left-radius: 1px;
}

.msg.ai .bubble::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, rgba(0,255,170,0.4), transparent);
}

/* ---- MARKDOWN ---- */
.md-content { min-width: 0; }
.md-content p { margin: 0 0 8px; }
.md-content p:last-child { margin-bottom: 0; }

.md-content pre {
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 3px;
    padding: 14px;
    overflow-x: auto;
    font-size: 12.5px;
    margin: 10px 0;
    border: 1px solid rgba(0,255,240,0.1);
    border-left: 2px solid rgba(0,255,240,0.4);
    position: relative;
    font-family: "Share Tech Mono", "Cascadia Code", monospace;
}

.md-content pre::before {
    content: '// CODE';
    position: absolute;
    top: 6px; right: 10px;
    font-size: 9px;
    color: rgba(0,255,240,0.25);
    letter-spacing: 0.15em;
}

.md-content code {
    background: rgba(0,255,240,0.06);
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 12.5px;
    font-family: "Share Tech Mono", monospace;
    color: #7efff5;
    border: 1px solid rgba(0,255,240,0.12);
}

.md-content pre code {
    background: none;
    padding: 0;
    border: none;
    color: var(--code-text);
}

.md-content ul, .md-content ol {
    padding-left: 1.4em;
    margin: 4px 0 8px;
}

.md-content li { margin: 3px 0; }
.md-content li::marker { color: var(--brand); }

.md-content h1,.md-content h2,.md-content h3 {
    margin: 12px 0 6px;
    font-family: "Orbitron", monospace;
    color: var(--brand);
    text-shadow: 0 0 10px rgba(0,200,255,0.3);
    letter-spacing: 0.05em;
}

.md-content h1 { font-size: 16px; }
.md-content h2 { font-size: 14px; }
.md-content h3 { font-size: 13px; color: var(--brand-2); text-shadow: 0 0 10px rgba(0,255,170,0.3); }

.md-content blockquote {
    border-left: 2px solid var(--brand-2);
    margin: 8px 0;
    padding: 6px 12px;
    color: var(--text-dim);
    background: rgba(0,255,170,0.04);
    border-radius: 0 3px 3px 0;
    font-style: italic;
}

.md-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 10px 0;
    font-size: 12.5px;
    font-family: "Share Tech Mono", monospace;
}

.md-content th, .md-content td {
    border: 1px solid rgba(0,200,255,0.15);
    padding: 7px 12px;
}

.md-content th {
    background: rgba(0,200,255,0.08);
    color: var(--brand);
    font-family: "Orbitron", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
}

.md-content tr:hover td { background: rgba(0,200,255,0.04); }

.md-content a { color: var(--brand); text-decoration: none; border-bottom: 1px solid rgba(0,200,255,0.3); }
.md-content a:hover { border-bottom-color: var(--brand); text-shadow: 0 0 6px rgba(0,200,255,0.4); }

/* ---- TOOL BLOCK ---- */
.tool-block {
    margin-top: 10px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,107,53,0.3);
    border-radius: 3px;
    padding: 12px;
    font-family: "Share Tech Mono", monospace;
    font-size: 12.5px;
    position: relative;
    overflow: hidden;
}

.tool-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,107,53,0.6), transparent);
}

.tool-title {
    color: var(--brand-3);
    margin-bottom: 8px;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(255,107,53,0.4);
    letter-spacing: 0.05em;
    font-size: 12px;
}

.tool-block pre {
    margin: 0;
    padding: 10px;
    background: rgba(0,0,0,0.5);
    border-radius: 2px;
    overflow-x: auto;
    border: 1px solid rgba(255,107,53,0.15);
    color: #ffaa7f;
}

.tool-actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
}

/* ---- INPUT COMPOSER ---- */
.composer {
    border-top: 1px solid var(--line);
    padding: 12px;
    background: rgba(0,0,0,0.2);
    position: relative;
}

.composer::before {
    content: '';
    position: absolute;
    top: -1px; left: 5%; right: 5%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,200,255,0.3), transparent);
}

.composer-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: end;
}

#userInput {
    width: 100%;
    min-height: 44px;
    max-height: 120px;
    resize: vertical;
    background: rgba(0,10,25,0.9);
    color: var(--text);
    border: 1px solid rgba(0,200,255,0.2);
    border-radius: 3px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: "Rajdhani", sans-serif;
    line-height: 1.5;
}

#userInput:focus {
    border-color: rgba(0,200,255,0.5);
    box-shadow: 0 0 12px rgba(0,200,255,0.1), inset 0 0 6px rgba(0,200,255,0.04);
    outline: none;
}

#userInput::placeholder {
    color: rgba(90,138,170,0.5);
    font-family: "Share Tech Mono", monospace;
    font-size: 12px;
}

/* ---- STATUS INDICATOR ---- */
.streaming-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--brand-2);
    vertical-align: middle;
    margin-left: 6px;
    box-shadow: var(--neon-glow-green);
}

/* ---- WEB SEARCH STATUS ---- */
#webSearchStatus {
    font-size: 11px;
    font-family: "Share Tech Mono", monospace;
    letter-spacing: 0.05em;
    padding: 4px 8px;
    border-radius: 2px;
    border: 1px solid transparent;
}

#googleStatus {
    font-size: 11px;
    font-family: "Share Tech Mono", monospace;
    letter-spacing: 0.05em;
    padding: 4px 8px;
    border-radius: 2px;
    border: 1px solid transparent;
}

/* Provider select highlight */
#providerSelect option[value="google"] {
    color: #a78bfa;
}

/* ---- MODAL ---- */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0,5,15,0.8);
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
}

.modal.open { display: flex; }

.modal-content {
    background: rgba(4,14,30,0.98);
    border: 1px solid rgba(0,200,255,0.25);
    border-radius: 4px;
    padding: 24px;
    width: 90%;
    max-width: 600px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 60px rgba(0,200,255,0.1), 0 0 120px rgba(0,200,255,0.05);
}

.modal-content::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--brand), transparent);
}

.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.modal-head h2 {
    margin: 0;
    font-size: 16px;
    font-family: "Orbitron", monospace;
    color: var(--brand);

<script>
marked.setOptions({ breaks: true, gfm: true });

const state = {
    currentSessionId: null,
    sessions: [],
    models: [],        // 当前 provider 过滤后的模型
    allModels: [],     // 服务端返回的全部模型
    provider: "ollama", // "ollama" | "google"
    isStreaming: false,
};

function escapeHtml(text = "") {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

async function api(url, options = {}) {
    const res = await fetch(url, options);
    if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `HTTP ${res.status}`);
    }
    return res.json();
}

function jsonPost(url, body) {
    return api(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
    });
}

function renderMarkdown(text) {
    const div = document.createElement("div");
    div.className = "md-content";
    div.innerHTML = marked.parse(text || "");
    return div;
}

// 用 WeakMap 存储工具调用数据，避免将 JSON 塞进 onclick 字符串（脆弱且有 XSS 风险）
const _toolCallStore = new WeakMap();

// ── 危险指令检测 ──────────────────────────────────────────────────────────────
// 返回 { dangerous: true, reason: "..." } 或 { dangerous: false }
function checkDangerous(toolCall) {
    const name = toolCall.function?.name;
    const args = toolCall.function?.arguments || {};

    // 危险的 Shell 命令模式
    const DANGEROUS_SHELL_PATTERNS = [
        // 删除类
        { re: /\brm\s+(-[a-zA-Z]*f[a-zA-Z]*|-[a-zA-Z]*r[a-zA-Z]*|-rf|-fr|--force|--recursive)/i, reason: "检测到强制删除命令 (rm -rf / rm -f)" },
        { re: /\brm\b.*\*/, reason: "检测到通配符删除命令 (rm ... *)" },
        { re: /\brmdir\b/i, reason: "检测到目录删除命令 (rmdir)" },
        { re: /\bshred\b/i, reason: "检测到文件粉碎命令 (shred)" },
        { re: /\btruncate\b/i, reason: "检测到文件截断命令 (truncate)" },
        // 覆盖 / 清空
        { re: /\bdd\b.*\bof=\/(dev|sys|proc)\b/i, reason: "检测到 dd 写入系统设备" },
        { re: /\bdd\b.*\bif=\/dev\/zero\b/i, reason: "检测到 dd 零填充操作" },
        { re: />\s*\/dev\/s[da-z]+\b/i, reason: "检测到向磁盘设备直接写入" },
        // 格式化 / 磁盘操作
        { re: /\bmkfs\b/i, reason: "检测到磁盘格式化命令 (mkfs)" },
        { re: /\bfdisk\b/i, reason: "检测到磁盘分区命令 (fdisk)" },
        { re: /\bparted\b/i, reason: "检测到磁盘分区命令 (parted)" },
        // 权限 / 系统破坏
        { re: /\bchmod\s+[0-7]*0+\s+\//, reason: "检测到对根路径下文件移除权限" },
        { re: /\bchown\s+.*\s+\//, reason: "检测到对根路径下文件更改所有者" },
        { re: /\bkill\s+(-9|-KILL|-SIGKILL)\s+1\b/i, reason: "检测到 kill -9 1 (杀死 init 进程)" },
        // 网络 / 外发
        { re: /\bcurl\b.*\|\s*(ba)?sh\b/i, reason: "检测到远程脚本下载执行 (curl | sh)" },
        { re: /\bwget\b.*\|\s*(ba)?sh\b/i, reason: "检测到远程脚本下载执行 (wget | sh)" },
        // 覆盖关键系统文件
        { re: />\s*\/(etc\/(passwd|shadow|sudoers|crontab|hosts)|bin\/|sbin\/|usr\/bin\/)/i, reason: "检测到向系统关键文件写入" },
        { re: /\b(sudo|su)\b.*\brm\b/i, reason: "检测到以超级用户权限删除文件" },
    ];

    // 危险的 Python 代码模式
    const DANGEROUS_PYTHON_PATTERNS = [
        { re: /\bos\.remove\b/i, reason: "检测到 os.remove() 文件删除调用" },
        { re: /\bos\.unlink\b/i, reason: "检测到 os.unlink() 文件删除调用" },
        { re: /\bshutil\.rmtree\b/i, reason: "检测到 shutil.rmtree() 目录删除调用" },
        { re: /\bos\.rmdir\b/i, reason: "检测到 os.rmdir() 目录删除调用" },
        { re: /subprocess.*['"](rm|shred|mkfs|fdisk)['"]/i, reason: "检测到通过 subprocess 执行危险命令" },
        { re: /\bopen\(['"]\/(etc|bin|sbin|usr).*['"],\s*['"]w/i, reason: "检测到向系统关键路径写入文件" },
    ];

    if (name === "run_shell" || name === "bash") {
        const cmd = args.command || args.cmd || "";
        for (const { re, reason } of DANGEROUS_SHELL_PATTERNS) {
            if (re.test(cmd)) return { dangerous: true, reason };
        }
    }

    if (name === "run_python" || name === "python") {
        const code = args.code || args.script || "";
        for (const { re, reason } of DANGEROUS_PYTHON_PATTERNS) {
            if (re.test(code)) return { dangerous: true, reason };
        }
    }

    if (name === "write_file") {
        const filename = args.filename || args.path || "";
        // 禁止覆盖系统关键路径
        if (/^\/(etc|bin|sbin|usr|boot|sys|dev)\//i.test(filename)) {
            return { dangerous: true, reason: `检测到写入系统关键路径: ${filename}` };
        }
    }

    return { dangerous: false };
}

// 智能滚动：仅当用户已在底部附近（100px 内）时才自动跟随
function smartScroll() {
    const chat = document.getElementById("chatBox");
    const nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 100;
    if (nearBottom) chat.scrollTop = chat.scrollHeight;
}

// skipScroll=true 用于批量渲染历史消息时，避免每条都触发滚动
function addMessage(role, text, skipScroll) {
    const chat = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "U" : "AI";

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const tag = document.createElement("div");
    tag.className = "role-tag";
    tag.textContent = role === "user" ? "USER" : "AI_CORE";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (role === "user") {
        bubble.textContent = text;
    } else {
        const mdDiv = document.createElement("div");
        mdDiv.className = "md-content";
        // 有初始内容时（加载历史）直接渲染 markdown，不留空
        if (text) mdDiv.innerHTML = marked.parse(text);
        bubble.appendChild(mdDiv);
    }

    wrap.append(tag, bubble);
    if (role === "user") {
        msg.append(wrap, avatar);
    } else {
        msg.append(avatar, wrap);
    }
    chat.appendChild(msg);
    if (!skipScroll) chat.scrollTop = chat.scrollHeight;
    return bubble;
}

function appendToken(bubble, fullText) {
    const mdDiv = bubble.querySelector(".md-content");
    if (mdDiv) mdDiv.innerHTML = marked.parse(fullText);
}

function renderToolResult(msg) {
    // 在聊天框中渲染工具执行结果（历史记录）
    const chat = document.getElementById("chatBox");
    const wrap = document.createElement("div");
    wrap.style.cssText = "margin: 4px 0 4px 52px; max-width: 85%;";

    const block = document.createElement("div");
    block.className = "tool-block";
    const toolName = escapeHtml(msg.name || "tool");
    const output   = msg.content || "";
    const isError  = output.startsWith("[") && output.includes("错误");
    block.innerHTML = `
        <div class="tool-title" style="color:${isError ? "var(--danger)" : "var(--brand-2)"}">
            ${isError ? "⚠" : "✓"} TOOL_RESULT :: ${toolName}
        </div>
        <pre style="max-height:200px;overflow-y:auto;margin:6px 0 0"><code>${escapeHtml(output)}</code></pre>`;

    wrap.appendChild(block);
    chat.appendChild(wrap);
    smartScroll();
}

function renderToolApproval(bubble, toolCalls) {
    toolCalls.forEach(tc => {
        const name = tc.function?.name;
        const args = tc.function?.arguments || {};

        let title, content, lang;
        if (name === "run_python") {
            title   = "⚡ EXEC_REQUEST :: Python";
            content = args.code || "";
            lang    = "python";
        } else if (name === "run_shell") {
            title   = "🖥️ EXEC_REQUEST :: Shell";
            content = args.command || "";
            lang    = "shell";
        } else if (name === "web_search") {
            title   = "🌐 NET_REQUEST :: Web Search";
            content = `query: ${args.query || ""}${args.max_results ? `\nmax_results: ${args.max_results}` : ""}`;
            lang    = "yaml";
        } else if (name === "write_file") {
            title   = "📄 WRITE_REQUEST :: File";
            content = `filename: ${args.filename || ""}\n\n${args.content || ""}`;
            lang    = "plaintext";
        
        } else if (name === "read_file") {
            title   = "📖 READ_REQUEST :: File";
            content = `path: ${args.path || ""}`;
            lang    = "plaintext";
        } else {
            title = "⚠️ UNKNOWN_REQUEST";
            content = JSON.stringify(tc, null, 2);
            lang = "json";
            return;
        }

        const dangerCheck = checkDangerous(tc);

        const block = document.createElement("div");
        block.className = "tool-block";

        if (dangerCheck.dangerous) {
            // 危险指令：展示被拒绝状态
            block.style.borderColor = "rgba(255,51,102,0.5)";
            block.innerHTML = `
                <div class="tool-title">${title}</div>
                <pre><code class="lang-${lang}">${escapeHtml(content)}</code></pre>
                <div class="tool-actions">
                    <span style="color:var(--danger);font-family:monospace;font-size:11px;text-shadow:var(--neon-glow-red)">
                        ⛔ BLOCKED — ${escapeHtml(dangerCheck.reason)}
                    </span>
                </div>`;
            bubble.appendChild(block);
        } else {
            // 安全指令：ReAct 模式下后端已自动执行，直接显示已执行状态
            block.innerHTML = `
                <div class="tool-title">${title}</div>
                <pre><code class="lang-${lang}">${escapeHtml(content)}</code></pre>
                <div class="tool-actions">
                    <span style="color:var(--brand-2);font-family:monospace;font-size:11px;text-shadow:var(--neon-glow-green)">
                        ⚡ REACT AUTO-EXECUTED
                    </span>
                </div>`;
            bubble.appendChild(block);
        }
    });
}

/**
 * 渲染一个 ReAct 推理步骤摘要块，插入到当前 AI 气泡中。
 * 对应后端 SSE 事件 "react_step"。
 */
function renderReactStep(bubble, { step, thought, action, action_input, observation }) {
    const block = document.createElement("div");
    block.className = "react-step";

    const argsStr = typeof action_input === "object"
        ? JSON.stringify(action_input, null, 1).replace(/\n/g, " ")
        : String(action_input || "");

    // 截断过长内容
    const truncate = (s, n = 120) => s.length > n ? s.slice(0, n) + "…" : s;

    block.innerHTML = `
        <div class="react-step-header">
            <span class="react-step-badge">STEP ${step}</span>
            <span>REACT TRACE</span>
        </div>
        ${thought ? `
        <div class="react-step-row">
            <span class="react-step-label">Thought</span>
            <span class="react-step-value">${escapeHtml(truncate(thought))}</span>
        </div>` : ""}
        ${action ? `
        <div class="react-step-row">
            <span class="react-step-label">Action</span>
            <span class="react-step-value action">${escapeHtml(action)}</span>
        </div>
        <div class="react-step-row">
            <span class="react-step-label">Input</span>
            <span class="react-step-value">${escapeHtml(truncate(argsStr, 160))}</span>
        </div>` : ""}
        ${observation ? `
        <div class="react-step-row" style="margin-top:4px">
            <span class="react-step-label">Obs.</span>
            <span></span>
        </div>
        <div class="react-obs">${escapeHtml(truncate(observation, 400))}</div>` : ""}
    `;
    bubble.appendChild(block);
    smartScroll();
}

function renderSessions() {
    const box = document.getElementById("sessionList");
    box.innerHTML = '<div class="session-list-header">SESSIONS</div>';
    state.sessions.forEach(s => {
        const div = document.createElement("div");
        div.className = `session-item${s.id === state.currentSessionId ? " active" : ""}`;

        const info = document.createElement("div");
        info.style.cssText = "flex:1;min-width:0;cursor:pointer;overflow:hidden";
        info.innerHTML = `
            <div class="name">${escapeHtml(s.name)}</div>
            <div class="meta">MDL: ${escapeHtml(s.model)} | MSG: ${s.message_count}</div>`;
        info.onclick = () => selectSession(s.id);

        const delBtn = document.createElement("button");
        delBtn.className = "btn danger small session-del-btn";
        delBtn.title = "删除对话";
        delBtn.textContent = "✕";
        delBtn.onclick = (e) => { e.stopPropagation(); deleteSession(s.id, s.name); };

        div.style.display = "flex";
        div.style.alignItems = "center";
        div.style.gap = "6px";
        div.append(info, delBtn);
        box.appendChild(div);
    });
}

async function deleteSession(sessionId, sessionName) {
    if (state.isStreaming) { alert("当前正在生成，请稍候再删除！"); return; }
    if (!confirm(`确定删除对话「${sessionName}」吗？`)) return;
    await api(`/sessions/${sessionId}`, { method: "DELETE" });
    if (state.currentSessionId === sessionId) {
        state.currentSessionId = null;
        document.getElementById("chatBox").innerHTML = "";
    }
    await loadSessions();
    if (!state.currentSessionId && state.sessions.length) {
        await selectSession(state.sessions[0].id);
    }
}

// 当前流式请求的 AbortController，用于前端中断 fetch
let _currentAbortController = null;

async function abortGeneration() {
    if (!state.isStreaming || !state.currentSessionId) return;
    // 1. 通知后端停止生成
    fetch(`/sessions/${state.currentSessionId}/abort`, { method: "POST" }).catch(() => {});
    // 2. 前端侧中止 fetch 读取
    if (_currentAbortController) {
        _currentAbortController.abort();
        _currentAbortController = null;
    }
}

/**
 * handleStream — ReAct 模式下的 SSE 流处理函数
 *
 * 布局设计：
 *   - react_step 事件：每步推理卡片直接插入聊天区（独立于气泡），
 *     不进入 aiBubble，这样每步都是独立卡片。
 *   - token 事件：Final Answer 文字渲染到 aiBubble（最终回答气泡）。
 *   - tool_call 事件：工具信息附加在最近一个 react_step 卡片里（如有）。
 */
async function handleStream(url, bodyObject, aiBubble) {
    state.isStreaming = true;
    _currentAbortController = new AbortController();
    updateSendButton();
    let fullText = "";
    // aiBubble 只用于 Final Answer；中间步骤插入聊天区独立节点
    const chat = document.getElementById("chatBox");

    try {
        const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bodyObject),
            signal: _currentAbortController.signal,
        });
        if (!res.ok) throw new Error("请求失败，请检查服务状态");

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "", currentEvent = "message", currentData = "";

        const processLine = (rawLine) => {
            const line = rawLine.replace(/\r$/, "");
            if (!line) {
                if (currentEvent === "token" && currentData) {
                    try {
                        const { text } = JSON.parse(currentData);
                        fullText += text || "";
                        // Final Answer 渲染到主气泡
                        appendToken(aiBubble, fullText);
                    } catch { /* skip */ }

                } else if (currentEvent === "react_step" && currentData) {
                    try {
                        const stepData = JSON.parse(currentData);
                        // 每步推理渲染为聊天区独立卡片（不挂在 aiBubble 上）
                        const wrapper = document.createElement("div");
                        wrapper.style.cssText = "margin: 6px 0 6px 10px;";
                        renderReactStep(wrapper, stepData);
                        // 插在 aiBubble 所在的 .msg 节点之前，保持时序
                        const msgNode = aiBubble.closest(".msg");
                        chat.insertBefore(wrapper, msgNode || null);
                        smartScroll();
                    } catch { /* skip */ }

                } else if (currentEvent === "tool_call" && currentData) {
                    // tool_call 仅展示，后端 ReAct 已自动执行
                    try {
                        const { tool_calls } = JSON.parse(currentData);
                        renderToolApproval(aiBubble, tool_calls);
                    } catch { /* skip */ }

                } else if (currentEvent === "aborted") {
                    const mdDiv = aiBubble.querySelector(".md-content");
                    if (mdDiv) {
                        mdDiv.innerHTML += `<p style="color:var(--text-dim);font-family:monospace;font-size:11px;margin-top:6px">// generation aborted</p>`;
                    }

                } else if (currentEvent === "error" && currentData) {
                    try {
                        const { error } = JSON.parse(currentData);
                        const mdDiv = aiBubble.querySelector(".md-content");
                        if (mdDiv) mdDiv.innerHTML += `<p style="color:var(--danger)">[ERR] ${escapeHtml(error)}</p>`;
                    } catch { /* skip */ }
                }

                currentEvent = "message";
                currentData = "";
                return;
            }
            if (line.startsWith("event:")) {
                currentEvent = line.slice(6).trim();
            } else if (line.startsWith("data:")) {
                const chunk = line.slice(5).trim();
                currentData = currentData ? `${currentData}\n${chunk}` : chunk;
            }
        };

        while (true) {
            const { done, value } = await reader.read();
            if (done) {
                if (buffer) {
                    buffer.split("\n").forEach(processLine);
                    processLine("");
                }
                break;
            }
            buffer += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buffer.indexOf("\n")) >= 0) {
                processLine(buffer.slice(0, idx));
                buffer = buffer.slice(idx + 1);
            }
            smartScroll();
        }
    } catch (e) {
        if (e.name === "AbortError") {
            // 前端主动中止，静默
        } else {
            const mdDiv = aiBubble.querySelector(".md-content");
            if (mdDiv) mdDiv.innerHTML += `<p style="color:var(--danger)">[EXCEPTION] ${escapeHtml(e.message)}</p>`;
        }
    } finally {
        state.isStreaming = false;
        _currentAbortController = null;
        updateSendButton();
        await loadSessions();
    }
}

async function approveTool(btnEl) {
    if (state.isStreaming || !state.currentSessionId) return;
    const actionsDiv = btnEl.parentElement;
    actionsDiv.innerHTML = "<span style='color:var(--brand-2);font-family:monospace;font-size:11px'>✓ AUTHORIZED — EXECUTING...</span>";
    const toolCalls = _toolCallStore.get(btnEl);
    if (!toolCalls) {
        actionsDiv.innerHTML = "<span style='color:var(--danger);font-family:monospace;font-size:11px'>[ERR] 工具数据丢失，请刷新重试</span>";
        return;
    }
    // 创建新的 AI 消息气泡，结果展示在新对话框中
    const resultBubble = addMessage("ai", "");
    await handleStream(`/sessions/${state.currentSessionId}/tool_stream`, { tool_calls: toolCalls }, resultBubble);
}

function denyTool(btnEl) {
    btnEl.parentElement.innerHTML = "<span style='color:var(--danger)'>✕ ACCESS DENIED</span>";
    state.isStreaming = false;
    updateSendButton();
}

async function sendMessage() {
    if (state.isStreaming || !state.currentSessionId) return;
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    // 发送前自动将当前选择的模型同步到 session，确保 provider 切换生效
    const selectedModel = document.getElementById("modelSelect").value;
    const maxTurns = Number(document.getElementById("turnsInput").value || 8);
    const currentSession = state.sessions.find(s => s.id === state.currentSessionId);
    if (currentSession && currentSession.model !== selectedModel) {
        await api(`/sessions/${state.currentSessionId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: selectedModel, max_turns: maxTurns }),
        });
    }

    input.value = "";
    addMessage("user", text);
    const aiBubble = addMessage("ai", "");
    const useRag = document.getElementById("useRag").checked;
    await handleStream(
        `/sessions/${state.currentSessionId}/stream`,
        { message: text, top_k: 3, use_rag: useRag },
        aiBubble,
    );
}

// ── Provider 切换 ──────────────────────────────────────────────────────────
function onProviderChange() {
    const sel = document.getElementById("providerSelect");
    state.provider = sel.value;
    filterModelsByProvider();
}

function filterModelsByProvider() {
    const select = document.getElementById("modelSelect");
    const prev = select.value;
    select.innerHTML = "";

    const filtered = state.allModels.filter(m =>
        state.provider === "google"
            ? m.startsWith("google:")
            : !m.startsWith("google:")
    );

    state.models = filtered;

    if (!filtered.length) {
        const msg = state.provider === "google"
            ? "// 请配置 GOOGLE_API_KEY"
            : "// NO OLLAMA MODELS";
        select.innerHTML = `<option value=''>${msg}</option>`;
        select.disabled = true;
        return;
    }
    select.disabled = false;
    filtered.forEach(m => {
        const opt = document.createElement("option");
        // 显示时去掉 "google:" 前缀，value 保留完整名
        opt.value = m;
        opt.text  = m.startsWith("google:") ? m.replace("google:", "✦ ") : m;
        select.appendChild(opt);
    });

    // 尽量保持之前选中的模型
    if (filtered.includes(prev)) select.value = prev;
}

async function loadModels() {
    const data = await api("/models");
    state.allModels = data.models || [];

    // 自动检测当前 session 的 provider
    if (state.currentSessionId) {
        const session = state.sessions.find(s => s.id === state.currentSessionId);
        if (session) {
            const isGoogle = session.model.startsWith("google:");
            state.provider = isGoogle ? "google" : "ollama";
            document.getElementById("providerSelect").value = state.provider;
        }
    }

    filterModelsByProvider();
}

async function loadToolConfig() {
    try {
        const data = await api("/config/tools");
        const ws = data.tools?.web_search;
        const el = document.getElementById("webSearchStatus");
        if (ws?.enabled) {
            el.innerHTML = "🌐 NET <span style='color:var(--brand-2);text-shadow:var(--neon-glow-green)'>ONLINE</span>";
            el.style.borderColor = "rgba(0,255,170,0.2)";
            el.style.background = "rgba(0,255,170,0.04)";
        } else {
            el.innerHTML = "🌐 NET <span style='color:rgba(255,255,255,0.2)'>OFFLINE</span>";
            el.style.borderColor = "rgba(255,255,255,0.06)";
        }

        // Google 状态
        const goog = data.providers?.google;
        const gel = document.getElementById("googleStatus");
        if (gel) {
            if (goog?.enabled) {
                gel.innerHTML = "✦ GEMINI <span style='color:#a78bfa;text-shadow:0 0 8px rgba(167,139,250,0.6)'>ONLINE</span>";
                gel.style.borderColor = "rgba(167,139,250,0.25)";
                gel.style.background = "rgba(167,139,250,0.05)";
            } else {
                gel.innerHTML = "✦ GEMINI <span style='color:rgba(255,255,255,0.2)'>OFFLINE</span>";
                gel.style.borderColor = "rgba(255,255,255,0.06)";
            }
        }
    } catch { /* silent */ }
}

async function loadSessions() {
    const data = await api("/sessions");
    state.sessions = data.sessions || [];
    renderSessions();
    if (!state.currentSessionId && state.sessions.length) {
        await selectSession(state.sessions[0].id);
    }
}

async function createSession() {
    if (state.isStreaming) { alert("当前正在生成，请稍候！"); return; }
    const model = document.getElementById("modelSelect").value || null;
    const data = await jsonPost("/sessions", { model, max_turns: 8 });
    await loadSessions();
    await selectSession(data.session.id);
}

async function selectSession(sessionId) {
    if (state.isStreaming) { alert("当前对话正在生成，请稍后切换！"); return; }
    state.currentSessionId = sessionId;
    renderSessions();
    const session = state.sessions.find(s => s.id === sessionId);
    if (session) {
        // 根据 session 的模型自动切换 provider
        const isGoogle = session.model.startsWith("google:");
        state.provider = isGoogle ? "google" : "ollama";
        document.getElementById("providerSelect").value = state.provider;
        filterModelsByProvider();
        document.getElementById("modelSelect").value = session.model;
        document.getElementById("turnsInput").value = session.max_turns;
    }
    const data = await api(`/sessions/${sessionId}/messages`);
    const chat = document.getElementById("chatBox");
    chat.innerHTML = "";
    (data.messages || []).forEach(m => {
        if (m.role === "system") return;

        if (m.role === "tool") {
            // 工具执行结果：展示在独立的结果块中
            renderToolResult(m);
            return;
        }

        // skipScroll=true：批量渲染时不逐条滚动，最后统一滚到底
        const bubble = addMessage(m.role === "assistant" ? "ai" : "user", m.content || "", true);

        if (m.tool_calls?.length) {
            // 历史工具调用：展示调用详情，但关闭操作按钮
            renderToolApproval(bubble, m.tool_calls);
            bubble.querySelectorAll(".tool-actions").forEach(
                act => (act.innerHTML = "<span style='color:var(--text-dim);font-family:monospace;font-size:11px'>// HISTORY: TOOL SESSION CLOSED</span>")
            );
        }
    });
    // 历史加载完毕后滚到底部
    chat.scrollTop = chat.scrollHeight;
}

async function saveSessionConfig() {
    if (!state.currentSessionId) return;
    const model = document.getElementById("modelSelect").value;
    const maxTurns = Number(document.getElementById("turnsInput").value || 8);
    await api(`/sessions/${state.currentSessionId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model, max_turns: maxTurns }),
    });
    alert("会话设置已保存");
    await loadSessions();
}

function openKbModal() { document.getElementById("kbModal").classList.add("open"); loadKbDocs(); }
function closeKbModal() { document.getElementById("kbModal").classList.remove("open"); }

async function loadKbDocs() {
    const data = await api("/kb/docs");
    const list = document.getElementById("kbList");
    list.innerHTML = "";
    const docs = data.documents || [];
    if (!docs.length) {
        list.innerHTML = "<div style='color:var(--text-dim);text-align:center;padding:20px 0;font-family:monospace;font-size:12px'>// NO DOCUMENTS FOUND</div>";
        return;
    }
    docs.forEach(d => {
        const item = document.createElement("div");
        item.className = "kb-item";
        item.innerHTML = `
            <div style="flex:1;margin-right:10px;overflow:hidden">
                <div style="font-weight:600;font-size:13px;margin-bottom:3px;color:var(--brand)">${escapeHtml(d.title)}</div>
                <div style="font-size:11px;color:var(--text-dim);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(d.content)}</div>
            </div>
            <button class="btn danger small" onclick="deleteKbDoc('${d.id}')">✕</button>`;
        list.appendChild(item);
    });
}

async function addKnowledge() {
    const titleEl = document.getElementById("kbTitle");
    const contentEl = document.getElementById("kbContent");
    const title = titleEl.value.trim();
    const content = contentEl.value.trim();
    if (!title || !content) return;
    await jsonPost("/kb/docs", { title, content });
    titleEl.value = contentEl.value = "";
    await loadKbDocs();
}

async function deleteKbDoc(id) {
    if (!confirm("确定要删除吗？")) return;
    await api(`/kb/docs/${id}`, { method: "DELETE" });
    await loadKbDocs();
}

function exportSession() {
    if (!state.currentSessionId) return;
    const a = document.createElement("a");
    a.href = `/sessions/${state.currentSessionId}/export`;
    a.click();
}

function updateSendButton() {
    const btn = document.getElementById("sendBtn");
    const abortBtn = document.getElementById("abortBtn");
    btn.disabled = state.isStreaming;
    if (state.isStreaming) {
        btn.innerHTML = `生成中<span class="streaming-dot"></span>`;
        abortBtn.style.display = "block";
    } else {
        btn.textContent = "发送";
        abortBtn.style.display = "none";
    }
}

function bindEvents() {
    document.getElementById("newSessionBtn").onclick = createSession;
    document.getElementById("sendBtn").onclick = sendMessage;
    document.getElementById("abortBtn").onclick = abortGeneration;
    document.getElementById("saveSessionBtn").onclick = saveSessionConfig;
    document.getElementById("kbBtn").onclick = openKbModal;
    document.getElementById("kbCloseBtn").onclick = closeKbModal;
    document.getElementById("addKbBtn").onclick = addKnowledge;
    document.getElementById("exportBtn").onclick = exportSession;
    document.getElementById("kbModal").onclick = e => {
        if (e.target === document.getElementById("kbModal")) closeKbModal();
    };
    document.getElementById("userInput").addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
}

async function init() {
    bindEvents();
    await loadModels();
    await loadToolConfig();
    await loadSessions();
    if (!state.currentSessionId) await createSession();
}

init().catch(e => alert("INIT_FAIL: " + e.message));
</script>
