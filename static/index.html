<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Assistant</title>
<style>
:root {
    --bg: #f3f5f8;
    --panel: #ffffff;
    --line: #d8dee9;
    --text: #132238;
    --sub: #4b5c77;
    --brand: #1c7ed6;
    --brand-2: #0ca678;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
        radial-gradient(circle at 10% 20%, #ddefff 0%, transparent 35%),
        radial-gradient(circle at 90% 10%, #dffcf2 0%, transparent 32%),
        var(--bg);
    color: var(--text);
}
.app {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 14px;
    height: 100vh; /* 修复问题：锁定视口高度 */
    padding: 14px;
    overflow: hidden; /* 防止整个页面滚动 */
}
.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
}
.sidebar {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}
.sidebar-head {
    padding: 14px;
    border-bottom: 1px solid var(--line);
}
.sidebar-head h1 {
    margin: 0 0 10px 0;
    font-size: 17px;
}
.btn {
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font-weight: 600;
}
.btn.primary {
    color: #fff;
    background: linear-gradient(135deg, var(--brand), #1864ab);
}
.btn.outline {
    color: var(--text);
    background: #f6f8fb;
    border: 1px solid var(--line);
}
.btn.danger {
    color: #e03131;
    background: #fff5f5;
    border: 1px solid #ffc9c9;
}
.session-list {
    flex: 1; /* 修复问题：占据剩余空间，单独溢出滚动 */
    overflow-y: auto;
    padding: 8px;
}
.session-item {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    background: #fff;
}
.session-item.active {
    border-color: var(--brand);
    background: #eef6ff;
}
.session-item .name {
    font-size: 14px;
    font-weight: 600;
}
.session-item .meta {
    margin-top: 6px;
    font-size: 12px;
    color: var(--sub);
}
.main {
    display: flex; /* 改用 flex，稳定控制内部结构 */
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}
.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
}
.toolbar label {
    font-size: 13px;
    color: var(--sub);
}
select, input[type="number"], textarea, input[type="text"] {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 14px;
}
.chat {
    flex: 1; /* 聊天区域自动撑开 */
    overflow-y: auto;
    padding: 14px;
}
.msg {
    display: flex;
    margin: 10px 0;
    width: 100%;
    align-items: flex-end;
    gap: 8px;
}
.msg.user {
    justify-content: flex-end;
}
.msg.ai {
    justify-content: flex-start;
}
.avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--line);
    color: #1d3557;
    background: #fff;
    flex: 0 0 28px;
}
.msg.user .avatar {
    background: #d8ecff;
    border-color: #9ec5f8;
}
.msg.ai .avatar {
    background: #e7fff5;
    border-color: #97e4c6;
}
.bubble-wrap {
    display: flex;
    flex-direction: column;
    max-width: min(78%, 760px);
}
.msg.user .bubble-wrap {
    align-items: flex-end;
}
.msg.ai .bubble-wrap {
    align-items: flex-start;
}
.role-tag {
    font-size: 11px;
    color: var(--sub);
    margin: 0 2px 4px 2px;
}
.bubble {
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
}
.msg.user .bubble {
    background: #e7f1ff;
    border-color: #b9d8ff;
}
.msg.ai .bubble {
    background: #f8fafc;
}
.composer {
    border-top: 1px solid var(--line);
    padding: 12px;
}
.composer-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
}
#userInput {
    width: 100%;
    min-height: 44px;
    max-height: 120px;
    resize: vertical;
}

/* 知识库弹窗样式 */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
}
.modal-content {
    background-color: var(--panel);
    padding: 24px;
    border-radius: 14px;
    width: 90%;
    max-width: 600px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}
.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}
.modal-head h2 { margin: 0; font-size: 18px; }
.close-btn { font-size: 24px; cursor: pointer; color: var(--sub); line-height: 1; }
.hint { font-size: 13px; color: var(--sub); background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--line); line-height: 1.5; }
.kb-inputs { display: grid; gap: 10px; padding-bottom: 16px; border-bottom: 1px dashed var(--line); margin-bottom: 16px;}
.kb-list-box { overflow-y: auto; flex: 1; }
.kb-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; background: #fafbfc;}

@media (max-width: 860px) {
    .app { grid-template-columns: 1fr; overflow: auto; height: auto; min-height: 100vh; }
    .sidebar { min-height: 220px; height: 300px; }
    .main { height: 600px; }
}
</style>
</head>
<body>
<div class="app">
    <aside class="panel sidebar">
        <div class="sidebar-head">
            <h1>Ollama AI 助手</h1>
            <button class="btn primary" id="newSessionBtn">+ 新建对话</button>
        </div>
        <div class="session-list" id="sessionList"></div>
    </aside>

    <section class="panel main">
        <div class="toolbar">
            <label>模型</label>
            <select id="modelSelect"></select>
            <label>上下文</label>
            <input id="turnsInput" type="number" min="1" max="50" value="8" style="width: 60px;">
            <label><input type="checkbox" id="useRag" checked> 启用 RAG</label>
            <button class="btn outline" id="saveSessionBtn">保存设置</button>
            <button class="btn outline" onclick="openKbModal()">📚 知识库设置</button>
        </div>

        <div class="chat" id="chatBox"></div>

        <div class="composer">
            <div class="composer-row">
                <textarea id="userInput" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
                <button class="btn primary" id="sendBtn">发送</button>
            </div>
        </div>
    </section>
</div>

<div id="kbModal" class="modal">
    <div class="modal-content">
        <div class="modal-head">
            <h2>📚 专属知识库设置</h2>
            <span class="close-btn" onclick="closeKbModal()">&times;</span>
        </div>
        <div class="hint">
            <strong>【使用说明】</strong><br>
            1. 在此处添加您的私有文档资料（如工作规范、学习笔记）。<br>
            2. 确保聊天页面的<strong>“启用 RAG”</strong>已勾选。<br>
            3. 聊天时，AI 会在回答前自动从知识库检索相关内容，让回答更懂你！
        </div>
        <div class="kb-inputs">
            <input id="kbTitle" type="text" placeholder="资料标题（如：公司请假制度）">
            <textarea id="kbContent" rows="3" placeholder="资料详细内容..."></textarea>
            <button class="btn primary" id="addKbBtn">添加至知识库</button>
        </div>
        <h3>已有知识文档</h3>
        <div class="kb-list-box" id="kbList"></div>
    </div>
</div>

<script>
let currentSessionId = null;
let sessions = [];
let models = [];
let isStreaming = false;

async function api(url, options = {}) {
    const res = await fetch(url, options);
    if (!res.ok) {
        const text = await res.text();
        throw new Error(text || ("HTTP " + res.status));
    }
    return res.json();
}

function renderSessions() {
    const box = document.getElementById("sessionList");
    box.innerHTML = "";
    sessions.forEach((s) => {
        const div = document.createElement("div");
        div.className = "session-item" + (s.id === currentSessionId ? " active" : "");
        div.innerHTML =
            "<div class='name'>" + escapeHtml(s.name) + "</div>" +
            "<div class='meta'>模型: " + escapeHtml(s.model) + " | 消息: " + s.message_count + "</div>";
        div.onclick = () => selectSession(s.id);
        box.appendChild(div);
    });
}

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function addMessage(role, text) {
    const chat = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = "msg " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.innerText = role === "user" ? "U" : "AI";

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const tag = document.createElement("div");
    tag.className = "role-tag";
    tag.innerText = role === "user" ? "用户" : "AI 助手";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = text;

    wrap.appendChild(tag);
    wrap.appendChild(bubble);

    if (role === "user") {
        msg.appendChild(wrap);
        msg.appendChild(avatar);
    } else {
        msg.appendChild(avatar);
        msg.appendChild(wrap);
    }
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
}

async function loadModels() {
    const data = await api("/models");
    models = data.models || [];
    const select = document.getElementById("modelSelect");
    select.innerHTML = "";
    if (models.length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.text = "未发现模型，请先执行 ollama pull";
        select.appendChild(opt);
        select.disabled = true;
        return;
    }
    select.disabled = false;
    models.forEach((m) => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.text = m;
        select.appendChild(opt);
    });
}

async function loadSessions() {
    const data = await api("/sessions");
    sessions = data.sessions || [];
    renderSessions();
    if (!currentSessionId && sessions.length > 0) {
        await selectSession(sessions[0].id);
    }
}

async function createSession() {
    if (isStreaming) {
        alert("当前正在生成回答，请稍后再操作！");
        return;
    }
    const model = document.getElementById("modelSelect").value || null;
    const maxTurns = Number(document.getElementById("turnsInput").value || 8);
    const data = await api("/sessions", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({model, max_turns: maxTurns})
    });
    await loadSessions();
    await selectSession(data.session.id);
}

async function selectSession(sessionId) {
    if (isStreaming) {
        alert("当前对话正在生成，请稍后切换对话！");
        return;
    }
    currentSessionId = sessionId;
    renderSessions();
    const session = sessions.find((s) => s.id === sessionId);
    if (session) {
        document.getElementById("modelSelect").value = session.model;
        document.getElementById("turnsInput").value = session.max_turns;
    }
    const data = await api("/sessions/" + sessionId + "/messages");
    const chat = document.getElementById("chatBox");
    chat.innerHTML = "";
    (data.messages || []).forEach((m) => {
        if (m.role === "system") return;
        addMessage(m.role === "assistant" ? "ai" : "user", m.content);
    });
}

async function saveSessionConfig() {
    if (!currentSessionId) return;
    const model = document.getElementById("modelSelect").value;
    const maxTurns = Number(document.getElementById("turnsInput").value || 8);
    await api("/sessions/" + currentSessionId, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({model, max_turns: maxTurns})
    });
    alert("会话设置已保存");
    await loadSessions();
}

async function sendMessage() {
    if (isStreaming || !currentSessionId) return;
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addMessage("user", text);
    const aiBubble = addMessage("ai", "...");
    isStreaming = true;

    const useRag = document.getElementById("useRag").checked;
    const topK = 3;

    try {
        const res = await fetch("/sessions/" + currentSessionId + "/stream", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: text, top_k: topK, use_rag: useRag})
        });
        if (!res.ok || !res.body) {
            throw new Error("流式请求失败，请检查服务状态");
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let currentEvent = "message";
        let currentData = "";
        aiBubble.innerText = "";

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {stream: true});
            let idx;
            while ((idx = buffer.indexOf("\n")) >= 0) {
                const line = buffer.slice(0, idx).trimEnd();
                buffer = buffer.slice(idx + 1);
                if (!line) {
                    if (currentEvent === "token" && currentData) {
                        const payload = JSON.parse(currentData);
                        aiBubble.innerText += payload.text || "";
                    } else if (currentEvent === "error" && currentData) {
                        const payload = JSON.parse(currentData);
                        aiBubble.innerText += "\n[错误] " + (payload.error || "未知异常");
                    }
                    currentEvent = "message";
                    currentData = "";
                    continue;
                }
                if (line.startsWith("event:")) {
                    currentEvent = line.slice(6).trim();
                } else if (line.startsWith("data:")) {
                    const chunk = line.slice(5).trim();
                    currentData = currentData ? (currentData + "\n" + chunk) : chunk;
                }
            }
            const chat = document.getElementById("chatBox");
            chat.scrollTop = chat.scrollHeight;
        }
    } catch (e) {
        aiBubble.innerText = "[请求失败] " + e.message;
    } finally {
        isStreaming = false;
        await loadSessions();
    }
}

/* 知识库管理逻辑 */
function openKbModal() {
    document.getElementById("kbModal").style.display = "flex";
    loadKbDocs();
}
function closeKbModal() {
    document.getElementById("kbModal").style.display = "none";
}
async function loadKbDocs() {
    const data = await api("/kb/docs");
    const list = document.getElementById("kbList");
    list.innerHTML = "";
    const docs = data.documents || [];
    if(docs.length === 0) {
        list.innerHTML = "<div style='color:#888; text-align:center; padding: 20px 0;'>暂无知识库文档，请在上方添加</div>";
        return;
    }
    docs.forEach(d => {
        const item = document.createElement("div");
        item.className = "kb-item";
        item.innerHTML = `
            <div style="flex:1; margin-right: 10px; overflow: hidden;">
                <div style="font-weight:600; font-size: 14px; margin-bottom: 4px;">${escapeHtml(d.title)}</div>
                <div style="font-size:12px; color:var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(d.content)}</div>
            </div>
            <button class="btn danger" onclick="deleteKbDoc('${d.id}')">删除</button>
        `;
        list.appendChild(item);
    });
}
async function addKnowledge() {
    const titleInput = document.getElementById("kbTitle");
    const contentInput = document.getElementById("kbContent");
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();
    if (!title || !content) {
        alert("标题和内容不能为空");
        return;
    }

    await api("/kb/docs", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title, content})
    });
    titleInput.value = "";
    contentInput.value = "";
    await loadKbDocs();
}
async function deleteKbDoc(id) {
    if(!confirm("确定要删除该资料吗？")) return;
    await api("/kb/docs/" + id, { method: "DELETE" });
    await loadKbDocs();
}

function bindEvents() {
    document.getElementById("newSessionBtn").onclick = createSession;
    document.getElementById("sendBtn").onclick = sendMessage;
    document.getElementById("saveSessionBtn").onclick = saveSessionConfig;
    document.getElementById("addKbBtn").onclick = addKnowledge;

    document.getElementById("userInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
}

async function init() {
    bindEvents();
    await loadModels();
    await loadSessions();
    if (!currentSessionId) {
        await createSession();
    }
}

init().catch((e) => {
    alert("初始化失败: " + e.message);
});
</script>
</body>
</html>
